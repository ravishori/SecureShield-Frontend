name: secureshield_app
description: SecureShield AI - Cyber Safety & Threat Prevention
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localisation
  flutter_localizations:
    sdk: flutter

  # Networking
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Auth & security
  local_auth: ^2.3.0

  # Permissions
  permission_handler: ^11.3.1

  # Device info
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.3

  # App scanning
  installed_apps: ^1.4.2

  # Wi-Fi scanning
  wifi_scan: ^0.4.1
  network_info_plus: ^5.0.0

  # Video playback for screen recordings
  video_player: ^2.9.2

  # Utilities
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  intl: ^0.20.0
  uuid: ^4.5.1
  crypto: ^3.0.5
  encrypt: ^5.0.3

  # Charts
  fl_chart: ^0.69.0

  # Markdown rendering for AI Coach responses
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2

  # File handling
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4

  # Call recording & audio playback
  record: ^6.0.0
  audioplayers: ^6.0.0

  # Sharing
  share_plus: ^10.0.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.6.0

  # Typography
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # QR scanner — UPI/URL safety verification
  mobile_scanner: ^5.2.3

  # OCR — Fake payment screenshot verifier (Google MLKit, on-device)
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
