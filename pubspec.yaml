name: secureshield_app
description: SecureShield AI - Cyber Safety & Threat Prevention
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Auth & security
  local_auth: ^2.3.0

  # Permissions
  permission_handler: ^11.3.1

  # Device info
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.3

  # App scanning
  installed_apps: ^1.4.2

  # Utilities
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.5
  encrypt: ^5.0.3

  # Charts
  fl_chart: ^0.69.0

  # File handling
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
