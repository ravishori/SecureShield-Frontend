org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Fix: Kotlin incremental compiler crashes on Windows when project (D:\) and
# Pub cache (C:\Users\...) are on different drives — it cannot resolve relative
# paths across drive roots (IllegalArgumentException: different roots).
kotlin.incremental=false
